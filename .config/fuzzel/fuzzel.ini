# fuzzel — Wayland application launcher (dmenu replacement)
#
# Optional component. Invoke it directly, or bind it in your WM:
#
#     fuzzel --dmenu
#
# Colours match Catppuccin Mocha / waybar's style.css.

[main]
lines = 12
prompt = "  › "
placeholder = "Search…"
font = JetBrainsMono Nerd Font:size=13
pointsize = 13
horizontal-offset = center
vertical-offset = center

[colors]
text = #cdd6f4
selected = #89b4fa
prompt = #cba6f7
placeholder = #6c7086
input-bg = #181825
input-border = #45475a
input-text = #cdd6f4
window-bg = #1e1e2e
window-border = #313244
border = #45475a
rounded = true
round-corner = 12
shadow = true
shadow-radius = 16